<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Meli ✨</title>
    <style>
        :root {
            --bg-soft: #f4fafe;
            --text-color: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-soft);
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            overflow-y: hidden; /* Se desbloquea en la fase 2 */
            transition: background-color 1s ease;
        }

        /* FASE 1: Click y Jardín */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none;
        }

        #intro-text {
            font-size: 1.5rem;
            color: #557;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .flower {
            position: absolute;
            font-size: 3rem;
            transform: translate(-50%, -50%) scale(0);
            animation: bloom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 5;
        }

        .hydrangea {
            font-size: 8rem;
            z-index: 6;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
        }

        @keyframes bloom {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        /* Lluvia de pétalos */
        .petal {
            position: fixed;
            top: -10%;
            width: 15px;
            height: 15px;
            background: #ffd700;
            border-radius: 15px 0 15px 0;
            pointer-events: none;
            z-index: 4;
            animation: fall linear infinite;
        }
        .petal.blue {
            background: #87cefa;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* Flash de iluminación */
        #flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* FASE 2: Scroll */
        #scroll-prompt {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            color: #557;
            z-index: 15;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #scroll-container {
            height: 400vh; /* Espacio para scrollear */
            display: none;
            position: relative;
            z-index: 1;
        }

        /* Ramo de flores */
        #bouquet-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            z-index: 2;
            pointer-events: none;
        }

        .bouquet-flower {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.5s ease;
        }

        /* Textos del scroll */
        .scroll-text {
            position: fixed;
            width: 80%;
            left: 10%;
            text-align: center;
            font-size: 2rem;
            color: #222;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            text-shadow: 0 2px 10px rgba(255,255,255,0.9);
        }

        .final-text {
            font-size: 2.2rem;
            color: #b8860b;
        }

        .final-text b {
            color: #ff4500;
        }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div id="intro-screen">
        <div id="intro-text">Toca cualquier parte de la pantalla ✨</div>
    </div>

    <div id="scroll-prompt">⬇ Desliza hacia abajo ⬇</div>

    <div id="scroll-container">
        <!-- Contenedor fijo para los textos y el ramo mientras se scrollea -->
        <div id="bouquet-wrapper"></div>
        <div id="text-1" class="scroll-text" style="top: 20%;">"Todo el mundo regala esto..."</div>
        <div id="text-2" class="scroll-text" style="top: 40%;">"Pero tú no eres todo el mundo"</div>
        <div id="text-3" class="scroll-text final-text" style="top: 60%;">"No quería darte las típicas flores amarillas, quería darte <b>tus</b> flores amarillas, un detalle solo para ti, Meli."</div>
    </div>

    <script>
        let clickCount = 0;
        let phase = 1;
        const targetClicks = Math.floor(Math.random() * 6) + 10; // Entre 10 y 15
        
        // Elementos
        const introText = document.getElementById('intro-text');
        const flash = document.getElementById('flash');
        const scrollPrompt = document.getElementById('scroll-prompt');
        const scrollContainer = document.getElementById('scroll-container');
        const bouquetWrapper = document.getElementById('bouquet-wrapper');
        
        const text1 = document.getElementById('text-1');
        const text2 = document.getElementById('text-2');
        const text3 = document.getElementById('text-3');

        // FASE 1: Click en la pantalla
        window.addEventListener('click', (e) => {
            if (phase !== 1) return;

            // Ocultar texto inicial al primer click
            if (clickCount === 0) introText.style.opacity = 0;

            clickCount++;

            // Crear flor amarilla normal
            createFlower(e.clientX, e.clientY, '🌼', false);

            if (clickCount === targetClicks) {
                triggerMagic(e.clientX, e.clientY);
            }
        });

        function createFlower(x, y, emoji, isHydrangea) {
            const flower = document.createElement('div');
            flower.className = 'flower' + (isHydrangea ? ' hydrangea' : '');
            flower.innerText = emoji;
            flower.style.left = x + 'px';
            flower.style.top = y + 'px';
            
            // Rotación aleatoria para que se vea natural
            flower.style.transform = `translate(-50%, -50%) scale(0) rotate(${Math.random() * 360}deg)`;
            
            document.body.appendChild(flower);
        }

        function triggerMagic(x, y) {
            phase = 2;
            
            // Flash de iluminación
            flash.style.opacity = 1;
            setTimeout(() => {
                flash.style.opacity = 0;
                document.body.style.backgroundColor = '#fffacd'; // Fondo se vuelve un amarillo muy suave
            }, 500);

            // Aparece la hortensia
            createFlower(x, y, '🪻', true); // Emoji de hortensia/jacinto

            // Lluvia de pétalos
            startPetalRain();

            // Preparar el scroll
            setTimeout(() => {
                scrollContainer.style.display = 'block';
                document.body.style.overflowY = 'auto'; // Permitir scroll
                scrollPrompt.style.opacity = 1;
                prepareBouquet();
            }, 2000);
        }

        function startPetalRain() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                
                // 30% de probabilidad de ser azul (típico de hortensias)
                if (Math.random() > 0.7) {
                    petal.classList.add('blue');
                }

                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 3 + 2) + 's';
                petal.style.opacity = Math.random() + 0.5;
                
                document.body.appendChild(petal);

                // Limpiar pétalos viejos
                setTimeout(() => { petal.remove(); }, 5000);
            }, 100); // Crea un pétalo cada 100ms
        }

        // FASE 2: Armado del ramo por Scroll
        const totalBouquetFlowers = 50;
        const bouquetFlowers = [];

        function prepareBouquet() {
            // Pre-crear las flores del ramo ocultas
            for (let i = 0; i < totalBouquetFlowers; i++) {
                const f = document.createElement('div');
                f.className = 'bouquet-flower';
                f.innerText = '🌼';
                
                // Distribución circular aleatoria
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.sqrt(Math.random()) * 120; // Radio máx 120px
                const x = 150 + Math.cos(angle) * radius;
                const y = 150 + Math.sin(angle) * radius;
                
                f.style.left = x + 'px';
                f.style.top = y + 'px';
                f.style.transform = `scale(0.1) rotate(${Math.random() * 360}deg)`;
                
                bouquetWrapper.appendChild(f);
                bouquetFlowers.push(f);
            }
        }

        window.addEventListener('scroll', () => {
            if (phase !== 2) return;
            
            // Ocultar la flecha de scroll apenas empiece a bajar
            scrollPrompt.style.opacity = 0;

            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrollPercent = scrollTop / scrollHeight; // Valor de 0 a 1

            // 1. Mostrar textos según el porcentaje de scroll
            manageText(text1, scrollPercent, 0.1, 0.35);
            manageText(text2, scrollPercent, 0.4, 0.65);
            
            // El texto final se queda en pantalla
            if (scrollPercent > 0.8) {
                text3.style.opacity = 1;
                text3.style.transform = 'translateY(0)';
            } else {
                text3.style.opacity = 0;
                text3.style.transform = 'translateY(20px)';
            }

            // 2. Armar el ramo progresivamente
            const flowersToShow = Math.floor(scrollPercent * totalBouquetFlowers);
            
            bouquetFlowers.forEach((flower, index) => {
                if (index < flowersToShow) {
                    flower.style.opacity = 1;
                    flower.style.transform = `scale(1.5) rotate(${index * 15}deg)`;
                } else {
                    flower.style.opacity = 0;
                    flower.style.transform = `scale(0.1)`;
                }
            });
            
            // Escalar todo el ramo al final
            if (scrollPercent > 0.7) {
                const extraScale = 1 + ((scrollPercent - 0.7) * 2); // Crece hasta el doble
                bouquetWrapper.style.transform = `translate(-50%, -50%) scale(${extraScale})`;
            } else {
                bouquetWrapper.style.transform = `translate(-50%, -50%) scale(1)`;
            }
        });

        function manageText(element, scroll, start, end) {
            if (scroll >= start && scroll <= end) {
                // Fade in
                element.style.opacity = 1;
                element.style.transform = 'translateY(0)';
            } else if (scroll > end) {
                // Fade out hacia arriba
                element.style.opacity = 0;
                element.style.transform = 'translateY(-20px)';
            } else {
                // Oculto abajo
                element.style.opacity = 0;
                element.style.transform = 'translateY(20px)';
            }
        }
    </script>
</body>
</html>
